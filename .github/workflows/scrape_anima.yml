name: Scraping de preços por polo (grupo Ânima)

on:
  schedule:
    # semanal, domingo às 08:00 UTC (05:00 no horário de Brasília) — mais
    # espaçado que o scraping via ead.com.br porque aqui são ~1000 páginas
    - cron: "0 8 * * 0"
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r scraper/requirements.txt

      - name: Instalar navegador do Playwright
        run: playwright install --with-deps chromium

      - name: Rodar scraper (grupo Ânima)
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python anima_scrape.py
